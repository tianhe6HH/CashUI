# 备用金管理系统 Nginx 配置（HTTP 访问）
# 前端构建产物位于 /var/www/cashui/dist，后端运行在 127.0.0.1:8000

server {
    listen 80;
    server_name _;   # 若已绑定域名，替换为你的域名

    # 前端静态文件
    root /var/www/cashui/dist;
    index index.html;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
